<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESS Target Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="header-left">
          <h1>ESS Target Finder</h1>
          <div class="control-group">
            <label for="fromSystem">Current System</label>
            <input id="fromSystem" type="text" placeholder="Jita" value="Jita" />
          </div>
        </div>
        <button id="refreshBtn">Refresh</button>
      </header>
      <section id="status">Loading targets…</section>
      <p class="help-text">system_jumps = killboard traffic; route_jumps = distance from the current system.</p>
      <table>
        <thead>
          <tr>
            <th>system_name</th>
            <th>region_name</th>
            <th>constellation_name</th>
            <th>system_id</th>
            <th>npc_kills</th>
            <th>ship_kills</th>
            <th>pod_kills</th>
            <th>system_jumps</th>
            <th>route_jumps</th>
            <th id="scoreHeader" class="sortable">score</th>
          </tr>
        </thead>
        <tbody id="targetsBody"></tbody>
      </table>
    </main>
    <script src="app.js"></script>
  </body>
</html>
